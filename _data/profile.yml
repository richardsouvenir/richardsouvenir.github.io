intro: >-
  I'm a Professor of Computer and Information Sciences and Vice Provost for Strategy and AI
  at Temple University. My research develops AI systems that help people interpret visual
  evidence and connect images to real-world places and contexts. As vice provost, I lead
  university strategy and Temple's approach to AI across teaching, research, and operations.

focus:
  - heading: Research
    color: cherry
    text: >-
      My lab works at the intersection of computer vision, visual search, and human-AI
      interaction: image retrieval and geolocation, interpretable similarity models, and
      studies of how people make decisions with AI-generated visual explanations. Much of
      this work supports investigators, including hotel recognition for human-trafficking
      cases. I have published 80+ peer-reviewed papers, supported by over $10M in funding
      from NSF, DOD, ARL, NIJ, and Google.
  - heading: AI and strategy at Temple
    color: indigo
    text: >-
      As Vice Provost for Strategy and AI, I lead university-wide strategic planning and
      Temple's approach to AI. I co-chair the University Strategic Plan Council, chaired the
      University Online Strategy Task Force, and co-chair a work group for Temple's Middle
      States (MSCHE) accreditation. Previously I served as Vice Provost for Strategic
      Initiatives, Interim Vice Provost for Graduate Education, and Associate Dean for
      Graduate Affairs in the College of Science and Technology.
  - heading: Service to the field
    color: teal
    text: >-
      General Chair for CVPR 2028; Program Chair for ICCV 2025; General Chair for WACV 2024 and Program Chair for WACV 2022
      and 2023; member of the WACV Steering Committee; Senior Area Chair for CVPR 2024 and
      Area Chair for CVPR, ICCV, and ECCV. Associate Editor of *Pattern Recognition* and
      *Machine Vision and Applications*.
  - heading: Imaging for Good
    color: amber
    text: >-
      I co-founded and serve as Vice President and Treasurer of Imaging for Good, a nonprofit
      that advances imaging and AI technology for social impact.

teaching: "Computer Vision, Machine Learning, Artificial Intelligence, Design and Analysis of Algorithms"
